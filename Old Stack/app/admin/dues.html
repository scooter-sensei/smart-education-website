<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dues · SmartEduTrack</title>
<link rel="icon" href="../../assets/logo.jpeg">
<meta name="theme-color" content="#F2F2F7">
<link rel="stylesheet" href="../shared/app.css">
<link rel="stylesheet" href="../shared/shell.css">
<script src="../shared/constants.js"></script>
<script src="../shared/auth.js"></script>
<script>SE.auth.require(SE.ROLE.SUPER_ADMIN);</script>
<script src="../shared/theme.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/app.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/shell.js"></script>
</head>
<body>
<main class="app-main">
  <div class="page-head">
    <h1>Dues</h1>
    <p>Everything still owed, by student — the fees generated by billing cycles that haven’t been fully paid. Collect against them from Payments.</p>
  </div>

  <div class="kpi-strip kpi-3" id="kpis" aria-label="Dues summary" aria-busy="true">
    <div class="skel" style="grid-column:1/-1"><div class="skel-row"></div></div>
  </div>

  <div class="list-tools" role="group" aria-label="Search dues">
    <div class="search-wrap" style="flex:1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="field search" id="searchInput" type="search" placeholder="Search student, ID or subject" autocomplete="off" aria-label="Search dues">
    </div>
  </div>

  <section class="panel">
    <div class="panel-head"><h2>Outstanding by student</h2><span class="count" id="listCount"></span></div>
    <div id="listBody"></div>
  </section>
</main>

<script>
(function(){
  'use strict';
  SE.shell.render('admin/dues.html');
  var esc=SE.esc, money=SE.money;
  var state={q:''};

  function initials(n){ return String(n||'?').trim().split(/\s+/).map(function(w){return w.charAt(0);}).slice(0,2).join('').toUpperCase(); }
  function monthLabel(m){ try{ return new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'}); }catch(e){ return m; } }

  var KB=document.getElementById('kpis');
  function cell(label,value,foot){ return '<div class="kpi"><p class="kl">'+esc(label)+'</p><p class="kv">'+value+'</p>'+(foot?'<p class="kf">'+esc(foot)+'</p>':'')+'</div>'; }
  function loadKpis(){
    SE.api.dues.summary().then(function(k){
      KB.setAttribute('aria-busy','false');
      KB.innerHTML=[
        cell('Total outstanding', money(k.totalDue)),
        cell('Students owing', k.students, k.students===1?'student':'students'),
        cell('Fees unpaid', k.records, k.records===1?'record':'records')
      ].join('');
    }).catch(function(){ KB.setAttribute('aria-busy','false'); KB.innerHTML=cell('Total outstanding','—'); });
  }
  loadKpis();

  var panel=SE.ui.listPanel({
    mount:'listBody', count:'listCount',
    fetch:function(){ return SE.api.dues.byStudent(state.q?{q:state.q}:{}); },
    empty:{title:'Nothing outstanding', sub:'Every generated fee has been paid. New dues appear here when a billing cycle is generated.', icon:'check'},
    row:function(s){
      var items=s.items.map(function(i){ return monthLabel(i.month)+' '+esc(i.subject)+' '+money(i.outstanding); }).join(' · ');
      return '<div class="row inset-ava" data-id="'+s.student_id+'"><span class="acct-ava" aria-hidden="true">'+esc(initials(s.student))+'</span>'+
        '<div class="row-main"><p class="row-title">'+esc(s.student)+' · <b style="font-weight:650;color:var(--red)">'+money(s.total)+'</b></p>'+
        '<p class="row-sub"><span class="lcode">'+esc(s.student_code)+'</span>'+(s.klass?' · '+esc(s.klass):'')+'</p>'+
        '<p class="row-sub">'+items+'</p></div>'+
        '<div class="row-acts"><a class="btn b-tinted b-xs" href="payments.html?student='+s.student_id+'">Collect</a></div></div>';
    }
  });

  var searchInput=document.getElementById('searchInput'), st;
  searchInput.addEventListener('input',function(){ clearTimeout(st); st=setTimeout(function(){ state.q=searchInput.value; panel.reload(); },200); });
})();
</script>
</body>
</html>
