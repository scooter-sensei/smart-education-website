<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students · SmartEduTrack</title>
<link rel="icon" href="../../assets/logo.jpeg">
<meta name="theme-color" content="#F2F2F7">
<link rel="stylesheet" href="../shared/app.css">
<link rel="stylesheet" href="../shared/shell.css">
<script src="../shared/constants.js"></script>
<script src="../shared/auth.js"></script>
<script>SE.auth.require(SE.ROLE.SUPER_ADMIN);</script>
<script src="../shared/theme.js"></script>
<script src="../shared/api.js"></script>
<script src="../shared/app.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/shell.js"></script>
</head>
<body>
<main class="app-main">
  <div class="page-head">
    <h1>Students</h1>
    <p>Every student here began as an approved registration — their code is permanent and never reused. Edit contact and guardian details anytime. Withdrawing stops billing but keeps all history; re-admitting opens a fresh admission in the current session.</p>
  </div>

  <div class="list-tools" role="group" aria-label="Filter students">
    <div class="seg" id="segStatus" role="tablist" aria-label="Status">
      <button type="button" class="on" data-status="" role="tab" aria-selected="true">All</button>
      <button type="button" data-status="ACTIVE" role="tab" aria-selected="false">Active</button>
      <button type="button" data-status="WITHDRAWN" role="tab" aria-selected="false">Withdrawn</button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="field search" id="searchInput" type="search" placeholder="Search name or student ID" autocomplete="off" aria-label="Search students by name or ID">
    </div>
  </div>

  <section class="panel">
    <div class="panel-head"><h2>Roster</h2><span class="count" id="listCount"></span></div>
    <div id="listBody"></div>
  </section>
</main>

<script>
(function(){
  'use strict';
  SE.shell.render('admin/students.html');
  var esc=SE.esc;
  var state={status:'', q:''};
  var byId={};
  var classesActive=[], activeSessionName='';

  /* active session + classes for the re-admit dialog (ready well before first click) */
  Promise.all([SE.api.students.activeClasses(), SE.api.students.activeSession()])
    .then(function(r){ classesActive=r[0]||[]; activeSessionName=r[1]||''; });

  function initials(n){ return String(n||'?').trim().split(/\s+/).map(function(w){return w.charAt(0);}).slice(0,2).join('').toUpperCase(); }

  function rowHtml(s){
    var acts='<button class="btn b-gray b-xs" type="button" data-act="edit">Edit</button>'+
      (s.status==='ACTIVE'
        ? '<button class="btn b-red-tinted b-xs" type="button" data-act="withdraw">Withdraw</button>'
        : '<button class="btn b-green-tinted b-xs" type="button" data-act="readmit">Re-admit</button>');
    return '<div class="row inset-ava" data-id="'+s.id+'">'+
      '<span class="acct-ava" aria-hidden="true">'+esc(initials(s.full_name))+'</span>'+
      '<div class="row-main">'+
        '<p class="row-title">'+esc(s.full_name)+'</p>'+
        '<p class="row-sub"><span class="lcode">'+esc(s.student_code)+'</span> · '+esc(s.klass)+' · '+esc(s.session)+'</p>'+
        '<p class="row-sub">Guardian '+esc(s.guardian_name||'—')+(s.guardian_phone?' · '+esc(s.guardian_phone):'')+(s.phone?' · student '+esc(s.phone):'')+'</p>'+
      '</div>'+
      '<div class="row-acts">'+SE.statusPill('admission',s.status).outerHTML+acts+'</div></div>';
  }

  var panel=SE.ui.listPanel({
    mount:'listBody', count:'listCount',
    fetch:function(){
      return SE.api.students.list(state.status?{status:state.status}:{}).then(function(list){
        var q=state.q.trim().toLowerCase();
        if(q) list=list.filter(function(s){
          return (s.full_name||'').toLowerCase().indexOf(q)>=0 || (s.student_code||'').toLowerCase().indexOf(q)>=0;
        });
        byId={}; list.forEach(function(s){ byId[s.id]=s; });
        return list;
      });
    },
    empty:{title:'No students match', sub:'Adjust the filter or search above. New students appear here once you approve a registration request.', icon:'box'},
    row:rowHtml,
    onAction:function(id,act,rowEl){
      var s=byId[id]; if(!s) return;
      if(act==='edit') openEdit(s,rowEl);
      else if(act==='withdraw') doWithdraw(s,rowEl);
      else if(act==='readmit') openReadmit(s,rowEl);
    }
  });

  function afterStatusChange(rowEl,s){
    if(state.status) panel.reload();            /* a filter is on — the row may leave the list */
    else rowEl.outerHTML=rowHtml(s);            /* All view — swap in place, no skeleton flash */
  }

  /* --- filter + search --- */
  var seg=document.getElementById('segStatus');
  seg.addEventListener('click',function(e){
    var b=e.target.closest('button[data-status]'); if(!b) return;
    [].forEach.call(seg.children,function(x){ var on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-selected',on?'true':'false'); });
    state.status=b.getAttribute('data-status'); panel.reload();
  });
  var searchInput=document.getElementById('searchInput'), st;
  searchInput.addEventListener('input',function(){
    clearTimeout(st); st=setTimeout(function(){ state.q=searchInput.value; panel.reload(); },200);
  });

  /* --- withdraw --- */
  function doWithdraw(s,rowEl){
    SE.ui.confirm({title:'Withdraw '+s.full_name+'?',
      body:'They’re marked withdrawn and stop being billed. Enrollments, attendance and payment history are preserved, and you can re-admit them later.',
      confirmLabel:'Withdraw', tone:'danger'}).then(function(ok){
      if(!ok) return;
      SE.api.students.withdraw(s.id).then(function(){ s.status='WITHDRAWN'; afterStatusChange(rowEl,s); SE.shell.toast(s.full_name+' was withdrawn.'); })
        .catch(function(){ SE.shell.toast('Couldn’t withdraw — try again.'); });
    });
  }

  /* --- re-admit (choose class; session is the current one) --- */
  function openReadmit(s,rowEl){
    if(!classesActive.length){ SE.shell.toast('Loading classes — try again in a moment.'); return; }
    var d=document.createElement('dialog'); d.className='se-dialog';
    var card=document.createElement('form'); card.className='se-dialog-card'; card.setAttribute('novalidate','');
    var opts=classesActive.map(function(c){ return '<option value="'+esc(c)+'"'+(c===s.klass?' selected':'')+'>'+esc(c)+'</option>'; }).join('');
    card.innerHTML=
      '<h3>Re-admit '+esc(s.full_name)+'?</h3>'+
      '<p class="dlg-desc"><span class="lcode">'+esc(s.student_code)+'</span> opens a fresh admission in the current session. Confirm the class they’re re-joining.</p>'+
      '<div class="f-grid f-2" style="margin-top:16px">'+
        '<label class="fld2"><span class="f-label">Class</span><select class="field" name="klass">'+opts+'</select></label>'+
        '<label class="fld2"><span class="f-label">Session</span><input class="field" value="'+esc(activeSessionName||s.session)+'" disabled></label>'+
      '</div>'+
      '<div class="se-dialog-acts">'+
        '<button class="btn b-gray b-sm" type="button" data-x="cancel">Cancel</button>'+
        '<button class="btn b-green b-sm" type="button" data-x="ok">Re-admit</button>'+
      '</div>';
    d.appendChild(card); document.body.appendChild(d);
    function dismiss(){ try{d.close();}catch(e){} d.remove(); }
    d.addEventListener('cancel',function(e){ e.preventDefault(); dismiss(); });   /* Esc */
    card.querySelector('[data-x="cancel"]').addEventListener('click',dismiss);
    var okBtn=card.querySelector('[data-x="ok"]');
    okBtn.addEventListener('click',function(){
      var klass=(card.elements.klass&&card.elements.klass.value)||s.klass;
      okBtn.disabled=true;
      SE.api.students.readmit(s.id,{klass:klass}).then(function(){
        s.status='ACTIVE'; s.klass=klass; dismiss(); afterStatusChange(rowEl,s); SE.shell.toast(s.full_name+' re-admitted to '+klass+'.');
      }).catch(function(){ okBtn.disabled=false; SE.shell.toast('Couldn’t re-admit — try again.'); });
    });
    d.showModal();
    var f=card.querySelector('select'); if(f) f.focus();
  }

  /* --- edit profile (contact + guardian; code / class / session are not edited here) --- */
  function fld(label,name,type,val,ph){
    return '<label class="fld2"><span class="f-label">'+esc(label)+'</span>'+
      '<input class="field" name="'+name+'" type="'+type+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'"'+
      (type==='email'?' autocapitalize="off" spellcheck="false"':'')+(type==='tel'?' inputmode="tel"':'')+' autocomplete="off">'+
      '<span class="fe" data-err="'+name+'"></span></label>';
  }
  function phoneRule(v){ if(!v) return null; return /^[0-9+\-\s]{7,15}$/.test(v)?null:'Enter a valid phone, or leave it blank.'; }

  function openEdit(s,rowEl){
    var d=document.createElement('dialog'); d.className='se-dialog wide';
    var form=document.createElement('form'); form.className='se-dialog-card'; form.setAttribute('novalidate','');
    form.innerHTML=
      '<h3>Edit student</h3>'+
      '<p class="dlg-desc"><span class="lcode">'+esc(s.student_code)+'</span> · '+esc(s.klass)+' · '+esc(s.session)+'. Class and session change through admission, not here.</p>'+
      '<div class="f-grid f-2">'+
        fld('Full name','full_name','text',s.full_name,'')+
        fld('Student phone · optional','phone','tel',s.phone,'98300 00000')+
        fld('Email · optional','email','email',s.email,'name@example.com')+
        fld('Guardian name','guardian_name','text',s.guardian_name,'')+
        fld('Guardian phone · optional','guardian_phone','tel',s.guardian_phone,'98300 00000')+
        '<label class="fld2" style="grid-column:1/-1"><span class="f-label">Address · optional</span><textarea class="field" name="address" rows="2" placeholder="Locality, town">'+esc(s.address||'')+'</textarea><span class="fe" data-err="address"></span></label>'+
      '</div>'+
      '<div class="se-dialog-acts">'+
        '<button class="btn b-gray b-sm" type="button" data-x="cancel">Cancel</button>'+
        '<button class="btn b-filled b-sm" type="button" data-x="save">Save changes</button>'+
      '</div>';
    d.appendChild(form); document.body.appendChild(d);

    function dismiss(){ try{d.close();}catch(e){} d.remove(); }
    d.addEventListener('cancel',function(e){ e.preventDefault(); dismiss(); });   /* Esc */
    form.querySelector('[data-x="cancel"]').addEventListener('click',dismiss);

    var saveBtn=form.querySelector('[data-x="save"]');
    saveBtn.addEventListener('click',function(){
      SE.ui.clearErrors(form);
      var ok=SE.ui.validate(form,{
        full_name:function(v){ return v?null:'Enter the student’s name.'; },
        phone:phoneRule,
        email:function(v){ if(!v)return null; return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?null:'That doesn’t look like an email address.'; },
        guardian_phone:phoneRule
      });
      if(!ok) return;
      saveBtn.disabled=true;
      var body={
        full_name:form.elements.full_name.value.trim(),
        phone:form.elements.phone.value.trim(),
        email:form.elements.email.value.trim(),
        guardian_name:form.elements.guardian_name.value.trim(),
        guardian_phone:form.elements.guardian_phone.value.trim(),
        address:form.elements.address.value.trim()
      };
      SE.api.students.updateProfile(s.id,body).then(function(u){
        var merged=u||Object.assign(s,body); byId[s.id]=merged;
        dismiss();
        rowEl.outerHTML=rowHtml(merged);
        SE.shell.toast('Saved '+(merged.full_name||'student')+'’s details.');
      }).catch(function(){ saveBtn.disabled=false; SE.shell.toast('Couldn’t save — try again.'); });
    });

    d.showModal();
    var first=form.querySelector('input,select,textarea'); if(first) first.focus();
  }
})();
</script>
</body>
</html>
